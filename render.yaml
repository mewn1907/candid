# Blueprint for Render — 2 services: signaling server (Node) + static frontend (Vite)
# Auto-wired via fromService: no manual CORS_ORIGIN / VITE_API_URL needed.
# Server normalizes bare hosts to https:// (server/src/config/env.ts)
# Client normalizes VITE_API_URL (room-context + webrtc hooks)

services:
  - type: web
    name: candid-server
    env: node
    plan: free
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        fromService:
          name: candid-client
          type: web
          property: host
      - key: STUN_SERVERS
        value: stun:stun.l.google.com:19302

  - type: web
    name: candid-client
    env: static
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: candid-server
          type: web
          property: host
